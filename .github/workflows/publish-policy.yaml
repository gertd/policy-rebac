name: publish_policy

on:
  workflow_dispatch:
  push:
    tags:
    - '*'

jobs:
  publish-policy:
    runs-on: ubuntu-latest
    name: build

    steps:
    - 
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - 
      name: Read policy config
      id: config
      uses: gertd/yaml-reader-action@v1
      with:
        file: .github/config-policy.yaml
    -
      name: Calc Tags
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          {{`${{ steps.config.outputs.server }}/${{ steps.config.outputs.repo }}`}}
        flavor: |
          latest=auto
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
    - 
      name: Clean Tags
      id: clean
      env:
        DOCKER_META_JSON: ${{ steps.meta.outputs.json }}
      run: |
        RESULT=$(jq -c --arg pre "${{ steps.config.outputs.server }}/${{ steps.config.outputs.repo }}:" '.["tag-names"] | map($pre + .)' <<< "$DOCKER_META_JSON")
        echo "tags<<EOF" >> "$GITHUB_OUTPUT"
        echo "$RESULT" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
    -
      name: Use Tags Array
      run: |
        echo "{{ steps.clean.outputs.tags }}"
    - 
      name: Policy Login
      id: policy-login
      uses: opcr-io/policy-login-action@v4
      with:
        username: ${{ steps.config.outputs.username }}
        password: ${{ secrets.POLICY_PUSH_KEY }}
        server: ${{ steps.config.outputs.server }}
    - 
      name: Policy Build
      id: policy-build
      uses: opcr-io/policy-build-action@v4
      with:
        src: content/src
        tag: ${{ steps.config.outputs.repo }}
        revision: "$GITHUB_SHA"
        rego_version: "rego.v1"
      env:
        POLICY_DEFAULT_DOMAIN: ${{ steps.config.outputs.server }}
    # -
    #   name: Dump meta
    #   id: dump-meta
    #   run: | 
    #     echo ${{ steps.meta.outputs.tags }} | jq .
    -
      name: Policy Tag
      id: policy-tag
      uses: opcr-io/policy-tag-action@v4
      with:
        source_tag: ${{ steps.config.outputs.server }}/${{ steps.config.outputs.repo }}:latest
        target_tags: ${{ steps.clean.outputs.tags }}
        verbosity: debug
      env:
        POLICY_DEFAULT_DOMAIN: ${{ steps.config.outputs.server }}
    - 
      name: Policy Push
      id: policy-push
      uses: opcr-io/policy-push-action@v4
      with:
        tags: ${{ fromJSON(steps.meta.outputs.json).tags }}
      env:
        POLICY_DEFAULT_DOMAIN: ${{ steps.config.outputs.server }}
    - 
      name: Policy Logout
      id: policy-logout
      uses: opcr-io/policy-logout-action@v4
      with:
        server: ${{ steps.config.outputs.server }}
